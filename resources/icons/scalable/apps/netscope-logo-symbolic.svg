<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Network nodes: a ringed hub (this machine) linked to four devices,
       two of them linked to each other. Spokes stop at the ring, so the hub
       reads as a ring at 16 px. currentColor so GTK recolours it. -->
  <path d="M4.95 5.65 L3.53 4.05 M9.60 5.80 L11.61 3.79 M10.34 9.51 L12.11 10.26 M5.19 10.95 L4.23 12.27 M4.6 2.95 L10.6 2.85"
        fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <g fill="currentColor">
    <circle cx="2.6" cy="3.0" r="1.7"/>
    <circle cx="12.6" cy="2.8" r="1.7"/>
    <circle cx="13.4" cy="10.8" r="1.7"/>
    <circle cx="3.4" cy="13.4" r="1.7"/>
    <path fill-rule="evenodd" d="M7.2 5.3999999999999995 a2.8 2.8 0 1 1 0 5.6 a2.8 2.8 0 1 1 0 -5.6 Z M7.2 7.1 a1.1 1.1 0 1 0 0 2.2 a1.1 1.1 0 1 0 0 -2.2 Z"/>
  </g>
</svg>
